# Fly.io configuration for Question Bank
# Replace 'your-app-name' with your chosen app name before deploying.

app = "your-app-name"
primary_region = "fra"

[build]

[env]
  HOST       = "0.0.0.0"
  PORT       = "8080"
  HTTPS_ONLY = "true"

# SESSION_SECRET_KEY and DATABASE_URL are set as secrets (not here):
#   fly secrets set SESSION_SECRET_KEY=<hex>
#   fly secrets set DATABASE_URL=sqlite:////data/question_bank.db

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

[[mounts]]
  source      = "qbank_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"
