{% extends "base.html" %}
{% block title %}{{ t('btn_new_faculty') }}{% endblock %}
{% block content %}
<div style="max-width:560px">

  <div class="page-header fade-up">
    <h2>{{ t('btn_save') if editing else t('btn_new_faculty') }}</h2>
  </div>

  <div class="card fade-up fade-up-1">
    <div class="card-body">
      <form method="post" action="{{ '/faculties/' ~ faculty.id ~ '/edit' if editing else '/faculties' }}">
        <div class="mb-3">
          <label class="form-label">{{ t('form_name') }} *</label>
          <input type="text" name="name" class="form-control" required autofocus
                 value="{{ faculty.name if editing else '' }}">
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">{{ t('btn_save') if editing else t('btn_new_faculty') }}</button>
          <a href="{{ '/faculties/' ~ faculty.id if editing else '/' }}" class="btn btn-outline-secondary">{{ t('btn_cancel') }}</a>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
