<!DOCTYPE html>
<html lang="{{ get_lang() }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('login_title') }} — {{ t('app_name') }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/app.css?v=11" rel="stylesheet">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">🧬</div>
      <div>
        <div class="login-logo-name">{{ org_setting('org_name', t('app_name')) }}</div>
        <div class="login-logo-sub">{{ org_setting('org_dept', t('app_subtitle')) }}</div>
      </div>
    </div>

    <h1 class="login-title">{{ t('login_title') }}</h1>
    <p class="login-subtitle">{{ t('login_subtitle') }}</p>

    {% if error %}
    <div class="login-error"><i class="bi bi-exclamation-circle me-2"></i>{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="login-field mb-3">
        <label for="email">{{ t('login_email') }}</label>
        <input type="email" id="email" name="email" required autofocus
               placeholder="teacher@university.ua">
      </div>
      <div class="login-field mb-4">
        <label for="password">{{ t('login_password') }}</label>
        <input type="password" id="password" name="password" required
               placeholder="••••••••">
      </div>
      <button type="submit" class="login-submit">{{ t('login_submit') }}</button>
    </form>

    <div style="margin-top:20px;text-align:center">
      <a href="/set-lang/uk" style="font-size:.75rem;margin-right:8px;color:var(--text-3);text-decoration:none{% if get_lang()=='uk' %};font-weight:700;color:var(--accent){% endif %}">УКР</a>
      <a href="/set-lang/en" style="font-size:.75rem;color:var(--text-3);text-decoration:none{% if get_lang()=='en' %};font-weight:700;color:var(--accent){% endif %}">ENG</a>
    </div>
  </div>
</div>
</body>
</html>
